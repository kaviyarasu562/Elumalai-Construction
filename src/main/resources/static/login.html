<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Sign in | Elumalai Constructions</title>
    <link rel="stylesheet" href="login.css">
</head>
<body>
    <main class="login-page">
        <section class="login-card" aria-labelledby="login-title">
            <p class="company-name">ELUMALAI CONSTRUCTIONS</p>
            <h1 id="login-title">Sign in</h1>
            <p class="intro">Use your administrator account to access the employee management system.</p>
            <p id="login-message" class="message" role="alert"></p>
            <form action="/login" method="post" id="login-form">
                <input type="hidden" name="_csrf" id="csrf-token">
                <label for="username">Username</label>
                <input id="username" name="username" autocomplete="username" required autofocus>
                <label for="password">Password</label>
                <input id="password" name="password" type="password" autocomplete="current-password" required>
                <button type="submit">Secure sign in</button>
            </form>
        </section>
    </main>
    <script>
        const params = new URLSearchParams(window.location.search);
        const message = document.getElementById("login-message");
        if (params.has("error")) message.textContent = "The username or password is incorrect.";
        if (params.has("logout")) message.textContent = "You have signed out successfully.";
        fetch("/api/csrf")
            .then(response => response.json())
            .then(token => document.getElementById("csrf-token").value = token.token)
            .catch(() => message.textContent = "Unable to prepare secure sign in. Please refresh the page.");
    </script>
</body>
</html>
